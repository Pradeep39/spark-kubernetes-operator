#
# The application is created in the Suspended state: the operator does not request a driver until
# an external component clears .spec.suspend. Setting it back to true on a running application
# releases the driver, and the application returns to Suspended to await re-admission.
#
#   kubectl patch sparkapp pi-suspended --type=merge -p '{"spec":{"suspend":false}}'  # admit
#   kubectl patch sparkapp pi-suspended --type=merge -p '{"spec":{"suspend":true}}'   # preempt
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: pi-suspended
spec:
  suspend: true
  mainClass: "org.apache.spark.examples.SparkPi"
  jars: "local:///opt/spark/examples/jars/spark-examples.jar"
  driverArgs: ["1000"]
  sparkConf:
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
    spark.kubernetes.container.image: "apache/spark:{{SPARK_VERSION}}-scala"
  applicationTolerations:
    instanceConfig:
      initExecutors: 2
      minExecutors: 2
      maxExecutors: 2
  runtimeVersions:
    sparkVersion: "4.2.0"
