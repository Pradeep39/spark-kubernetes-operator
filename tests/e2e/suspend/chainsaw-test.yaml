apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spark-operator-suspend-validation
spec:
  bindings:
    - name: SPARK_APP_NAMESPACE
      value: default
    - name: SPARK_APPLICATION_NAME
      value: spark-job-suspend-test
  steps:
  # An application created with .spec.suspend set must not get a driver at all.
  - name: suspended-before-start-up
    try:
    - apply:
        file: spark-example-suspend.yaml
    - assert:
        timeout: 60s
        file: "../assertions/spark-application/spark-suspended-before-start.yaml"
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: spark-job-suspend-test-0-driver
            namespace: ($SPARK_APP_NAMESPACE)
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
  # Clearing the flag admits the application and the driver starts up as usual.
  - name: admitted-when-suspend-cleared
    try:
    - script:
        env:
          - name: SPARK_APPLICATION_NAME
            value: ($SPARK_APPLICATION_NAME)
        timeout: 30s
        content: |
          kubectl patch sparkapplication $SPARK_APPLICATION_NAME \
            --type=merge -p '{"spec":{"suspend":false}}'
    - assert:
        timeout: 300s
        file: "../assertions/spark-application/spark-suspend-admitted.yaml"
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
  # Setting the flag again releases the driver and parks the app back in Suspended, without
  # advancing any restart or failure counter.
  - name: preempted-when-suspend-set-again
    try:
    - script:
        env:
          - name: SPARK_APPLICATION_NAME
            value: ($SPARK_APPLICATION_NAME)
        timeout: 30s
        content: |
          kubectl patch sparkapplication $SPARK_APPLICATION_NAME \
            --type=merge -p '{"spec":{"suspend":true}}'
    - assert:
        timeout: 300s
        file: "../assertions/spark-application/spark-suspend-preempted.yaml"
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: spark-job-suspend-test-0-driver
            namespace: ($SPARK_APP_NAMESPACE)
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    finally:
    - script:
        env:
          - name: SPARK_APPLICATION_NAME
            value: ($SPARK_APPLICATION_NAME)
        timeout: 30s
        content: |
          kubectl delete sparkapplication $SPARK_APPLICATION_NAME
